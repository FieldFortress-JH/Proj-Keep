# Breeze MDM Module — Docker Compose Override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mdm.yml up -d
#
# This adds the MDM sidecar service (Apple MDM protocol server) to the stack.
# The sidecar shares PostgreSQL with the API and exposes:
#   - /mdm/*      → Apple devices (MDM protocol: enroll, check-in, command response)
#   - /internal/* → Breeze API (command queue, APNs config, device info)
#   - /health     → Health check
#
# Environment variables (set in .env):
#   MDM_PUBLIC_URL         - Public URL devices use (e.g., https://mdm.breeze.example.com)
#   MDM_SIDECAR_PUBLIC_URL - Same as above, read by the API (must match MDM_PUBLIC_URL)
#   APNS_PRODUCTION        - "true" for production APNs, "false" (default) for sandbox
#
# IMPORTANT: Apple devices MUST reach the MDM sidecar over public HTTPS.
# The sidecar's /mdm/* endpoints are called directly by iPhones/iPads/Macs.
# Caddy routes /mdm/* to this service.

services:
  breeze-mdm:
    build:
      context: ./apps/mdm-server
      dockerfile: Dockerfile
    container_name: breeze-mdm
    restart: unless-stopped
    environment:
      MDM_LISTEN_ADDR: ":8443"
      MDM_PUBLIC_URL: ${MDM_PUBLIC_URL:-https://mdm.${BREEZE_DOMAIN:-localhost}}
      BREEZE_API_URL: http://api:3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-breeze}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-breeze}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      # TLS: In production, mount certs and set these:
      # MDM_TLS_CERT_FILE: /certs/mdm.crt
      # MDM_TLS_KEY_FILE: /certs/mdm.key
    # volumes:
    #   - mdm-certs:/certs:ro
    # Uncomment for TLS certs (production):
    #   - ./docker/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8443/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - breeze
    # Expose internally only — Caddy routes /mdm/* to this service
    # Do NOT publish 8443 to the host (Caddy handles TLS termination)

  # Mount the MDM env vars into the API container so it can reach the sidecar
  api:
    environment:
      MDM_SIDECAR_URL: http://breeze-mdm:8443
      MDM_SIDECAR_PUBLIC_URL: ${MDM_SIDECAR_PUBLIC_URL:-${MDM_PUBLIC_URL:-https://mdm.${BREEZE_DOMAIN:-localhost}}}

# volumes:
#   mdm-certs:

networks:
  breeze:
    name: breeze
